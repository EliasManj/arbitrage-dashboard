<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arbitrage Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js" defer></script>
  <style>
    [x-cloak] {
      display: none !important;
    }

    :root {
      --bg: #0a0a0b;
      --surface: #111113;
      --surface-2: #1c1c1f;
      --border: #27272a;
      --border-soft: #1e1e21;
      --text: #fafafa;
      --text-2: #a1a1aa;
      --text-3: #52525b;
      --emerald: #34d399;
      --emerald-dim: rgba(52, 211, 153, 0.10);
      --sky: #38bdf8;
      --sky-dim: rgba(56, 189, 248, 0.10);
      --violet: #a78bfa;
      --violet-dim: rgba(167, 139, 250, 0.10);
      --amber: #f59e0b;
      --amber-dim: rgba(245, 158, 11, 0.10);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
    }

    /* Sidebar nav items */
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      text-align: left;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.4;
      color: var(--text-2);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: background 0.1s, color 0.1s;
    }

    .nav-item:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .nav-item.active {
      background: var(--surface-2);
      color: var(--text);
    }

    /* Card hover */
    .event-card {
      transition: border-color 0.15s;
    }

    .event-card:hover {
      border-color: var(--border) !important;
    }

    /* Sticky section header inside an expanded card.
       --card-header-h matches the rendered height of the sticky card header button. */
    :root {
      --card-header-h: 68px;
    }

    .section-label {
      position: sticky;
      top: var(--card-header-h);
      z-index: 4;
      background: var(--surface);
      margin: -12px -16px 10px;
      /* escape py-3 top and px-4 horizontal padding */
      padding: 10px 16px 8px;
      border-bottom: 1px solid var(--border-soft);
    }

    /* Pill badge */
    .pill {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Smooth scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* Bet button */
    .bet-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-3);
      cursor: pointer;
      transition: all 0.1s;
      flex-shrink: 0;
      line-height: 1;
      padding: 0;
    }
    .bet-btn:hover {
      background: var(--amber-dim);
      color: var(--amber);
      border-color: rgba(245,158,11,0.4);
    }
    .bet-btn.bet-active {
      background: var(--amber-dim);
      color: var(--amber);
      border-color: rgba(245,158,11,0.4);
    }

    /* Collapse transition fix */
    [x-cloak] {
      display: none !important;
    }
  </style>
</head>

<body class="flex flex-col" style="height:100vh;overflow:hidden" x-data="dashboard()" x-init="init()" x-cloak>

  <!-- Top bar -->
  <header style="background:var(--surface);border-bottom:1px solid var(--border-soft);height:52px;flex-shrink:0;"
    class="flex items-center justify-between px-5 z-20">
    <div class="flex items-center gap-2.5">
      <!-- Wordmark -->
      <svg class="w-4 h-4" style="color:var(--emerald)" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 17l4-4 4 4 4-5 4-2" />
      </svg>
      <span class="font-semibold text-sm tracking-tight" style="color:var(--text)">Arbitrage</span>
      <span style="color:var(--border)" class="text-sm select-none">/</span>
      <span class="text-sm" style="color:var(--text-2)" x-text="leagueLabel"></span>
    </div>

    <div class="flex items-center gap-4">
      <span class="mono text-xs" style="color:var(--text-3)" x-text="eventsLabel"></span>
      <template x-if="lastUpdated">
        <span class="text-xs" style="color:var(--text-3)">
          Updated <span class="mono" style="color:var(--text-2)" x-text="lastUpdatedAgo"></span>
        </span>
      </template>
      <template x-if="!lastUpdated">
        <span class="text-xs animate-pulse" style="color:var(--text-3)">Loading...</span>
      </template>
      <button @click="showBetsPanel = !showBetsPanel"
        :style="showBetsPanel ? 'background:var(--amber-dim);border-color:rgba(245,158,11,0.35);color:var(--amber)' : 'background:var(--surface-2);border:1px solid var(--border-soft);color:var(--text-2);'"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs transition-colors"
        style="border:1px solid var(--border-soft);">
        <svg class="w-3.5 h-3.5 flex-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg>
        <span>Bets</span>
        <template x-if="activeBets.length > 0">
          <span class="mono font-semibold text-xs px-1 rounded"
            style="background:var(--amber);color:#000;line-height:1.4;"
            x-text="activeBets.length"></span>
        </template>
      </button>
      <button @click="manualRefresh()" :disabled="refreshing"
        style="background:var(--surface-2);border:1px solid var(--border-soft);color:var(--text-2);"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs disabled:opacity-40 transition-colors"
        onmouseover="this.style.borderColor='#3f3f46'" onmouseout="this.style.borderColor='var(--border-soft)'">
        <svg :class="refreshing ? 'animate-spin' : ''" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span x-text="refreshing ? 'Refreshing...' : 'Refresh'"></span>
      </button>
    </div>
  </header>

  <!-- Body -->
  <div class="flex flex-1" style="overflow:hidden">

    <!-- Sidebar -->
    <aside
      style="width:212px;flex-shrink:0;background:var(--bg);border-right:1px solid var(--border-soft);overflow-y:auto;"
      class="flex flex-col py-4 gap-1">

      <!-- Sport -->
      <div class="px-3 mb-1">
        <p class="px-2 mb-2 text-xs font-semibold uppercase tracking-widest" style="color:var(--text-3)">Sport</p>
        <button @click="activeSport = 'all'" :class="activeSport === 'all' ? 'active' : ''" class="nav-item">
          <span>All Sports</span>
          <span class="mono text-xs" style="color:var(--text-3)" x-text="events.length"></span>
        </button>
        <template x-for="sp in availableSports" :key="sp">
          <button @click="activeSport = sp; activeLeague = 'all'" :class="activeSport === sp ? 'active' : ''" class="nav-item">
            <span class="capitalize" x-text="sp"></span>
            <span class="mono text-xs" style="color:var(--text-3)"
              x-text="events.filter(e => e.sport === sp).length"></span>
          </button>
        </template>
      </div>

      <!-- Divider -->
      <div style="border-top:1px solid var(--border-soft);margin:4px 12px;"></div>

      <!-- Leagues -->
      <div class="px-3 mb-1">
        <p class="px-2 mb-2 text-xs font-semibold uppercase tracking-widest" style="color:var(--text-3)">League</p>
        <button @click="activeLeague = 'all'" :class="activeLeague === 'all' ? 'active' : ''" class="nav-item">
          <span>All Leagues</span>
          <span class="mono text-xs" style="color:var(--text-3)" x-text="sportEvents.length"></span>
        </button>
        <template x-for="lg in availableLeagues" :key="lg">
          <button @click="activeLeague = lg" :class="activeLeague === lg ? 'active' : ''" class="nav-item">
            <span x-text="formatLeague(lg)"></span>
            <span class="mono text-xs" style="color:var(--text-3)"
              x-text="sportEvents.filter(e => e.league === lg).length"></span>
          </button>
        </template>
      </div>

      <!-- Divider -->
      <div style="border-top:1px solid var(--border-soft);margin:4px 12px;"></div>

      <!-- Bet type -->
      <div class="px-3">
        <p class="px-2 mb-2 text-xs font-semibold uppercase tracking-widest" style="color:var(--text-3)">Bet Type</p>

        <button @click="activeFilter = 'all'" :class="activeFilter === 'all' ? 'active' : ''" class="nav-item">
          <span>All</span>
          <span class="mono text-xs" style="color:var(--text-3)" x-text="leagueEvents.length"></span>
        </button>

        <button @click="activeFilter = 'arb'" :class="activeFilter === 'arb' ? 'active' : ''" class="nav-item">
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full flex-none" style="background:var(--emerald)"></span>
            <span>Arbitrage</span>
          </div>
          <span class="mono text-xs" style="color:var(--text-3)"
            x-text="leagueEvents.filter(e => e.arbitrage.some(a => a.is_arbitrage)).length"></span>
        </button>

        <button @click="activeFilter = 'ev'" :class="activeFilter === 'ev' ? 'active' : ''" class="nav-item">
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full flex-none" style="background:var(--sky)"></span>
            <span>+EV Bets</span>
          </div>
          <span class="mono text-xs" style="color:var(--text-3)"
            x-text="leagueEvents.filter(e => e.ev_bets.length > 0).length"></span>
        </button>

        <button @click="activeFilter = 'corr'" :class="activeFilter === 'corr' ? 'active' : ''" class="nav-item">
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full flex-none" style="background:var(--violet)"></span>
            <span>Correlation</span>
          </div>
          <span class="mono text-xs" style="color:var(--text-3)"
            x-text="leagueEvents.filter(e => e.correlation_bets.length > 0).length"></span>
        </button>
      </div>

      <!-- Divider -->
      <div style="border-top:1px solid var(--border-soft);margin:4px 12px;"></div>

      <!-- Actions -->
      <div class="px-3">
        <p class="px-2 mb-2 text-xs font-semibold uppercase tracking-widest" style="color:var(--text-3)">Actions</p>
        <button @click="clearCache()" :disabled="clearing" class="nav-item" style="color:var(--text-3);"
          onmouseover="this.style.color='#f87171'" onmouseout="this.style.color='var(--text-3)'">
          <div class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5 flex-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            <span x-text="clearing ? 'Clearing...' : 'Clear Cache'"></span>
          </div>
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main style="flex:1;overflow-y:auto;background:var(--bg);">

      <!-- Empty / loading -->
      <template x-if="filteredEvents.length === 0">
        <div class="flex flex-col items-center justify-center h-full" style="color:var(--text-3)">
          <svg class="w-7 h-7 mb-3 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
          <p class="text-sm" x-text="lastUpdated ? 'No events match the current filter.' : 'Loading results...'"></p>
        </div>
      </template>

      <!-- Event list -->
      <div class="p-4 flex flex-col gap-2">
        <template x-for="ev in filteredEvents" :key="ev.home_team + ev.away_team + ev.league">
          <div class="event-card rounded-lg"
            style="background:var(--surface);border:1px solid var(--border-soft);overflow:clip;"
            x-data="{ open: false }">

            <!-- Card header (always visible, clickable) -->
            <button @click="open = !open" class="w-full text-left px-4 py-3 flex items-center justify-between gap-3"
              style="position:sticky;top:0;z-index:5;background:var(--surface);transition:background 0.1s;"
              onmouseover="this.style.background='#161618'" onmouseout="this.style.background='var(--surface)'">
              <div class="flex-1 min-w-0">
                <p class="font-medium text-base leading-tight truncate" style="color:var(--text)"
                  x-text="ev.home_team + ' vs ' + ev.away_team"></p>
                <div class="flex flex-wrap items-center gap-x-2 gap-y-1 mt-1.5">
                  <span class="mono text-xs" style="color:var(--text-3)" x-text="formatTime(ev.start_time)"></span>
                  <template x-if="ev.arbitrage.filter(a => a.is_arbitrage).length > 0">
                    <span class="pill mono font-medium" style="color:var(--emerald);background:var(--emerald-dim)"
                      x-text="ev.arbitrage.filter(a => a.is_arbitrage).length + ' arb'"></span>
                  </template>
                  <template x-if="ev.ev_bets.length > 0">
                    <span class="pill mono font-medium" style="color:var(--sky);background:var(--sky-dim)"
                      x-text="ev.ev_bets.length + ' +EV'"></span>
                  </template>
                  <template x-if="ev.correlation_bets.length > 0">
                    <span class="pill mono font-medium" style="color:var(--violet);background:var(--violet-dim)"
                      x-text="ev.correlation_bets.length + ' corr'"></span>
                  </template>
                </div>
              </div>

              <div class="flex items-center gap-2 shrink-0">
                <div class="hidden md:flex gap-1">
                  <template x-for="bk in ev.bookmakers" :key="bk">
                    <span class="pill" style="background:var(--surface-2);color:var(--text-3)" x-text="bk"></span>
                  </template>
                </div>
                <svg :class="open ? 'rotate-180' : ''" style="color:var(--text-3);transition:transform 0.2s;"
                  class="w-4 h-4 flex-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              </div>
            </button>

            <!-- Collapsible body -->
            <template x-if="open">
              <div style="border-top:1px solid var(--border-soft)">
                <div style="divide-color:var(--border-soft)" class="divide-y">

                  <!-- Arbitrage -->
                  <template x-if="ev.arbitrage.length > 0">
                    <div class="px-4 py-3">
                      <p class="font-semibold uppercase tracking-widest section-label"
                        style="font-size:13px;color:var(--emerald)">
                        Arbitrage / Best Odds
                      </p>
                      <div class="flex flex-col gap-3">
                        <template x-for="arb in ev.arbitrage" :key="arb.market_type + (arb.line ?? '')">
                          <div class="rounded-md px-2.5 py-2" :style="arb.is_arbitrage
                               ? 'background:var(--emerald-dim);border:1px solid rgba(52,211,153,0.18)'
                               : 'background:transparent;border:1px solid transparent'">
                            <div class="flex items-center justify-between mb-1.5">
                              <span class="text-xs font-medium capitalize" style="color:var(--text-2)"
                                x-text="formatMarket(arb.market_type, arb.line)"></span>
                              <span class="pill mono font-semibold" :style="arb.is_arbitrage
                                    ? 'color:var(--emerald);background:rgba(52,211,153,0.18)'
                                    : 'color:var(--text-3);background:var(--surface-2)'"
                                x-text="(arb.is_arbitrage ? '+' : '') + arb.profit_margin.toFixed(2) + '%'"></span>
                            </div>
                            <div class="flex flex-wrap gap-1.5">
                              <template x-for="o in arb.best_outcomes" :key="o.outcome_name">
                                <div x-data="{ expanded: false }">
                                  <div class="flex items-center gap-1.5 px-2 py-1 rounded text-xs"
                                    :style="arb.is_arbitrage ? 'background:rgba(52,211,153,0.12)' : 'background:var(--surface-2)'">
                                    <span class="capitalize" style="color:var(--text-3)"
                                      x-text="o.outcome_name.replace(/_/g,' ')"></span>
                                    <span class="mono font-semibold" style="color:var(--text)" x-text="o.odds"></span>
                                    <span style="color:var(--text-3)" x-text="'@ ' + o.bookmaker"></span>
                                    <template x-if="ev.bookmaker_urls && ev.bookmaker_urls[o.bookmaker]">
                                      <a :href="ev.bookmaker_urls[o.bookmaker]" target="_blank" rel="noopener"
                                        class="mono" style="color:var(--text-3);text-decoration:none;line-height:1;"
                                        title="Open at bookmaker" @click.stop>↗</a>
                                    </template>
                                    <template
                                      x-if="o.bookmaker === 'polymarket' || o.bookmaker === 'teammexico' || o.bookmaker === 'playdoit'">
                                      <button @click.stop="expanded = !expanded"
                                        style="background:none;border:none;cursor:pointer;padding:0;color:var(--text-3);font-size:9px;line-height:1;"
                                        :title="expanded ? 'Hide price' : 'Show price on site'"
                                        x-text="expanded ? '▲' : '▼'"></button>
                                    </template>
                                    <button @click.stop="toggleBet('arb', ev, arb, o)"
                                      class="bet-btn" :class="isBetAdded('arb', ev, arb, o) ? 'bet-active' : ''"
                                      :title="isBetAdded('arb', ev, arb, o) ? 'Remove from active bets' : 'Add to active bets'"
                                      x-text="isBetAdded('arb', ev, arb, o) ? '✓' : '+'"></button>
                                  </div>                                  <template x-if="o.bookmaker === 'polymarket' && expanded">
                                    <div class="px-2 py-1 mt-0.5 rounded text-xs mono flex items-center gap-2"
                                      :style="arb.is_arbitrage ? 'background:rgba(52,211,153,0.06)' : 'background:var(--bg)'">
                                      <span style="color:var(--text-3)">on polymarket:</span>
                                      <span class="font-semibold" style="color:var(--text)"
                                        x-text="polymarketLabel(o.outcome_name, arb.line) + ' ' + (o.raw_price != null ? Math.round(o.raw_price * 100) : Math.round(100/o.odds)) + '¢'"></span>
                                    </div>
                                  </template>
                                  <template
                                    x-if="(o.bookmaker === 'teammexico' || o.bookmaker === 'playdoit') && expanded">
                                    <div class="px-2 py-1 mt-0.5 rounded text-xs mono flex items-center gap-2"
                                      :style="arb.is_arbitrage ? 'background:rgba(52,211,153,0.06)' : 'background:var(--bg)'">
                                      <span style="color:var(--text-3)" x-text="'on ' + o.bookmaker + ':'"></span>
                                      <span class="font-semibold" style="color:var(--text)"
                                        x-text="americanOdds(o.odds)"></span>
                                    </div>
                                  </template>
                                </div>
                              </template>
                            </div>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>

                  <!-- +EV -->
                  <template x-if="ev.ev_bets.length > 0">
                    <div class="px-4 py-3">
                      <p class="font-semibold uppercase tracking-widest section-label"
                        style="font-size:13px;color:var(--sky)">
                        +EV Bets
                      </p>
                      <div class="flex flex-col gap-1.5">
                        <template x-for="bet in ev.ev_bets"
                          :key="bet.market_type + (bet.line ?? '') + bet.outcome_name + bet.bookmaker">
                          <div x-data="{ expanded: false }">
                            <div class="flex items-center justify-between px-2 py-1.5 rounded text-xs"
                              style="background:var(--surface-2)">
                              <div class="flex items-center gap-2 min-w-0">
                                <span class="capitalize" style="color:var(--text-3)"
                                  x-text="formatMarket(bet.market_type, bet.line)"></span>
                                <span class="capitalize truncate" style="color:var(--text-2)"
                                  x-text="bet.outcome_name.replace(/_/g,' ')"></span>
                              </div>
                              <div class="flex items-center gap-3 shrink-0">
                                <span class="mono" style="color:var(--text-2)"
                                  x-text="bet.odds + ' @ ' + bet.bookmaker"></span>
                                <template x-if="ev.bookmaker_urls && ev.bookmaker_urls[bet.bookmaker]">
                                  <a :href="ev.bookmaker_urls[bet.bookmaker]" target="_blank" rel="noopener" class="mono"
                                    style="color:var(--text-3);text-decoration:none;line-height:1;"
                                    title="Open at bookmaker" @click.stop>↗</a>
                                </template>
                                <template x-if="bet.bookmaker === 'teammexico' || bet.bookmaker === 'playdoit'">
                                  <button @click.stop="expanded = !expanded"
                                    style="background:none;border:none;cursor:pointer;padding:0;color:var(--text-3);font-size:9px;line-height:1;"
                                    :title="expanded ? 'Hide price' : 'Show price on site'"
                                    x-text="expanded ? '▲' : '▼'"></button>
                                </template>
                                <span class="mono font-semibold" style="color:var(--sky)"
                                  x-text="'+' + bet.edge.toFixed(2) + '%'"></span>
                                <button @click.stop="toggleBet('ev', ev, bet)"
                                  class="bet-btn" :class="isBetAdded('ev', ev, bet) ? 'bet-active' : ''"
                                  :title="isBetAdded('ev', ev, bet) ? 'Remove from active bets' : 'Add to active bets'"
                                  x-text="isBetAdded('ev', ev, bet) ? '✓' : '+'"></button>
                              </div>
                            </div>
                            <template x-if="(bet.bookmaker === 'teammexico' || bet.bookmaker === 'playdoit') && expanded">
                              <div class="px-2 py-1 mt-0.5 rounded text-xs mono flex items-center gap-2"
                                style="background:var(--bg)">
                                <span style="color:var(--text-3)" x-text="'on ' + bet.bookmaker + ':'"></span>
                                <span class="font-semibold" style="color:var(--text)"
                                  x-text="americanOdds(bet.odds)"></span>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>

                  <!-- Correlation -->
                  <template x-if="ev.correlation_bets.length > 0">
                    <div class="px-4 py-3">
                      <p class="font-semibold uppercase tracking-widest section-label"
                        style="font-size:13px;color:var(--violet)">
                        Correlation Bets
                      </p>
                      <div class="flex flex-col gap-2">
                        <template x-for="(bet, i) in ev.correlation_bets.slice(0, 15)" :key="i">
                          <div class="px-2 py-2 rounded text-xs" style="background:var(--surface-2)">
                            <div class="flex items-center justify-between mb-1.5">
                              <span style="color:var(--text-3)">
                                Combo <span class="mono font-semibold" style="color:var(--text)"
                                  x-text="bet.combined_odds.toFixed(2)"></span>
                              </span>
                              <div class="flex items-center gap-2">
                                <span class="mono font-semibold" style="color:var(--violet)"
                                  x-text="'+' + bet.edge.toFixed(2) + '%'"></span>
                                <button @click.stop="toggleBet('corr', ev, bet)"
                                  class="bet-btn" :class="isBetAdded('corr', ev, bet) ? 'bet-active' : ''"
                                  :title="isBetAdded('corr', ev, bet) ? 'Remove from active bets' : 'Add to active bets'"
                                  x-text="isBetAdded('corr', ev, bet) ? '✓' : '+'"></button>
                              </div>
                            </div>
                            <div class="flex flex-wrap gap-1">
                              <template x-for="leg in bet.legs"
                                :key="leg.market_type + (leg.line ?? '') + leg.outcome_name">
                                <span class="flex items-center gap-1 px-1.5 py-0.5 rounded"
                                  style="background:var(--surface);color:var(--text-2)">
                                  <span class="capitalize" x-text="formatMarket(leg.market_type, leg.line)"></span>
                                  <span class="capitalize" x-text="' ' + leg.outcome_name.replace(/_/g,' ')"></span>
                                  <span class="mono" style="color:var(--text-3)"
                                    x-text="' ' + leg.odds + ' @' + leg.bookmaker"></span>
                                  <template x-if="ev.bookmaker_urls && ev.bookmaker_urls[leg.bookmaker]">
                                    <a :href="ev.bookmaker_urls[leg.bookmaker]" target="_blank" rel="noopener"
                                      class="mono" style="color:var(--text-3);text-decoration:none;line-height:1;"
                                      title="Open at bookmaker" @click.stop>↗</a>
                                  </template>
                                </span>
                              </template>
                            </div>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>

                </div>
              </div>
            </template>

          </div>
        </template>
      </div>
    </main>

    <!-- Active Bets panel -->
    <aside x-show="showBetsPanel"
      style="width:270px;flex-shrink:0;background:var(--bg);border-left:1px solid var(--border-soft);overflow-y:auto;display:flex;flex-direction:column;">

      <!-- Panel header -->
      <div class="flex items-center justify-between px-4 py-3"
        style="border-bottom:1px solid var(--border-soft);flex-shrink:0;">
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold uppercase tracking-widest" style="color:var(--text-2)">Active Bets</span>
          <template x-if="activeBets.length > 0">
            <span class="mono text-xs px-1.5 rounded font-semibold"
              style="background:var(--amber-dim);color:var(--amber)" x-text="activeBets.length"></span>
          </template>
        </div>
        <template x-if="activeBets.length > 0">
          <button @click="clearActiveBets()" class="text-xs" style="color:var(--text-3);"
            onmouseover="this.style.color='#f87171'" onmouseout="this.style.color='var(--text-3)'">Clear all</button>
        </template>
      </div>

      <!-- Empty state -->
      <template x-if="activeBets.length === 0">
        <div class="flex flex-col items-center justify-center gap-2 py-16 px-6" style="color:var(--text-3)">
          <svg class="w-6 h-6 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          <p class="text-xs text-center">Click <span class="mono font-bold" style="color:var(--amber)">+</span> on any outcome to track it here.</p>
        </div>
      </template>

      <!-- Bets list -->
      <div class="flex flex-col gap-2 p-3">
        <template x-for="bet in activeBets.slice().reverse()" :key="bet.id">
          <div class="rounded-lg text-xs" style="background:var(--surface);border:1px solid var(--border-soft);">

            <!-- Bet header: event + remove -->
            <div class="flex items-start justify-between gap-1.5 px-3 pt-2.5 pb-1.5"
              style="border-bottom:1px solid var(--border-soft)">
              <div class="min-w-0">
                <p class="font-medium leading-snug" style="color:var(--text)"
                  x-text="bet.home_team + ' vs ' + bet.away_team"></p>
                <p class="mt-0.5" style="color:var(--text-3)"
                  x-text="formatLeague(bet.league) + ' · ' + formatTime(bet.start_time)"></p>
              </div>
              <button @click="removeBet(bet.id)"
                style="background:none;border:none;cursor:pointer;color:var(--text-3);font-size:14px;line-height:1;padding:0;flex-shrink:0;margin-top:1px;"
                onmouseover="this.style.color='#f87171'" onmouseout="this.style.color='var(--text-3)'">×</button>
            </div>

            <!-- Arb / EV bet body -->
            <template x-if="bet.source === 'arb' || bet.source === 'ev'">
              <div class="px-3 py-2 flex flex-col gap-1">
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-1.5 min-w-0">
                    <span class="pill font-semibold flex-none"
                      :style="bet.source === 'arb'
                        ? 'color:var(--emerald);background:var(--emerald-dim)'
                        : 'color:var(--sky);background:var(--sky-dim)'"
                      x-text="bet.source === 'arb' ? 'ARB' : '+EV'"></span>
                    <span class="capitalize truncate" style="color:var(--text-2)"
                      x-text="formatMarket(bet.market_type, bet.line)"></span>
                    <span class="capitalize truncate" style="color:var(--text-2)"
                      x-text="bet.outcome_name.replace(/_/g,' ')"></span>
                  </div>
                  <div class="flex items-center gap-1.5 shrink-0">
                    <span class="mono font-bold" style="color:var(--text)" x-text="bet.odds"></span>
                    <template x-if="bet.bookmaker === 'teammexico' || bet.bookmaker === 'playdoit'">
                      <span class="mono text-xs" style="color:var(--amber)" x-text="americanOdds(bet.odds)"></span>
                    </template>
                    <template x-if="bet.bookmaker === 'polymarket' && bet.raw_price != null">
                      <span class="mono text-xs" style="color:var(--amber)"
                        x-text="Math.round(bet.raw_price * 100) + '¢'"></span>
                    </template>
                  </div>
                </div>
                <div class="flex items-center justify-between">
                  <span style="color:var(--text-3)" x-text="'@ ' + bet.bookmaker"></span>
                  <template x-if="bet.edge != null">
                    <span class="mono font-semibold" style="color:var(--sky)"
                      x-text="'+' + bet.edge.toFixed(2) + '%'"></span>
                  </template>
                  <template x-if="bet.profit_margin != null">
                    <span class="mono font-semibold" style="color:var(--emerald)"
                      x-text="'+' + bet.profit_margin.toFixed(2) + '%'"></span>
                  </template>
                </div>
              </div>
            </template>

            <!-- Correlation bet body -->
            <template x-if="bet.source === 'corr'">
              <div class="px-3 py-2 flex flex-col gap-1.5">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-1.5">
                    <span class="pill font-semibold" style="color:var(--violet);background:var(--violet-dim)">CORR</span>
                    <span class="mono" style="color:var(--text-2)" x-text="'combo ' + bet.combined_odds.toFixed(2)"></span>
                  </div>
                  <span class="mono font-semibold" style="color:var(--violet)"
                    x-text="'+' + bet.edge.toFixed(2) + '%'"></span>
                </div>
                <div class="flex flex-wrap gap-1">
                  <template x-for="leg in bet.legs" :key="leg.market_type + (leg.line ?? '') + leg.outcome_name">
                    <span class="px-1.5 py-0.5 rounded capitalize" style="background:var(--surface-2);color:var(--text-3)">
                      <span x-text="leg.outcome_name.replace(/_/g,' ')"></span>
                      <span class="mono" x-text="' ' + leg.odds + '@' + leg.bookmaker"></span>
                    </span>
                  </template>
                </div>
              </div>
            </template>

          </div>
        </template>
      </div>
    </aside>

  </div>

  <script>
    function dashboard() {
      return {
        events: [],
        lastUpdated: null,
        refreshIntervalSeconds: 300,
        refreshing: false,
        clearing: false,
        activeSport: 'all',
        activeLeague: 'all',
        activeFilter: 'all',
        pollTimer: null,
        agoTimer: null,
        activeBets: [],
        showBetsPanel: false,

        get availableSports() {
          return [...new Set(this.events.map(e => e.sport).filter(Boolean))].sort();
        },

        get availableLeagues() {
          return [...new Set(this.sportEvents.map(e => e.league).filter(Boolean))].sort();
        },

        get sportLabel() {
          if (this.activeSport === 'all') return 'All Sports';
          return this.activeSport.charAt(0).toUpperCase() + this.activeSport.slice(1);
        },

        get leagueLabel() {
          if (this.activeLeague === 'all') return this.sportLabel;
          return this.formatLeague(this.activeLeague);
        },

        get sportEvents() {
          if (this.activeSport === 'all') return this.events;
          return this.events.filter(e => e.sport === this.activeSport);
        },

        get leagueEvents() {
          if (this.activeLeague === 'all') return this.sportEvents;
          return this.sportEvents.filter(e => e.league === this.activeLeague);
        },

        get filteredEvents() {
          return this.leagueEvents.filter(e => {
            if (this.activeFilter === 'arb') return e.arbitrage.some(a => a.is_arbitrage);
            if (this.activeFilter === 'ev') return e.ev_bets.length > 0;
            if (this.activeFilter === 'corr') return e.correlation_bets.length > 0;
            return true;
          });
        },

        get eventsLabel() {
          const n = this.filteredEvents.length;
          return n + (n === 1 ? ' event' : ' events');
        },

        get lastUpdatedAgo() {
          if (!this.lastUpdated) return '';
          const diff = Math.floor((Date.now() - this.lastUpdated) / 1000);
          if (diff < 60) return diff + 's ago';
          if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
          return Math.floor(diff / 3600) + 'h ago';
        },

        init() {
          this.loadBets();
          this.fetchResults();
          this.agoTimer = setInterval(() => { this.lastUpdated = this.lastUpdated; }, 10_000);
        },

        async fetchResults() {
          try {
            const res = await fetch('/api/results');
            const data = await res.json();
            this.events = data.events ?? [];
            this.refreshIntervalSeconds = data.refresh_interval_seconds ?? 300;
            if (data.last_updated) this.lastUpdated = new Date(data.last_updated).getTime();
          } catch (e) {
            console.error('Failed to fetch results', e);
          }
          if (this.pollTimer) clearTimeout(this.pollTimer);
          this.pollTimer = setTimeout(() => this.fetchResults(), this.refreshIntervalSeconds * 1000);
        },

        async clearCache() {
          if (this.clearing) return;
          this.clearing = true;
          try {
            await fetch('/api/cache', { method: 'DELETE' });
            this.events = [];
            this.lastUpdated = null;
          } catch (e) {
            console.error('Failed to clear cache', e);
          } finally {
            this.clearing = false;
          }
        },

        async manualRefresh() {
          if (this.refreshing) return;
          this.refreshing = true;
          try {
            await fetch('/api/refresh', { method: 'POST' });
            let attempts = 0;
            const poll = async () => {
              await this.fetchResults();
              if (++attempts < 60) setTimeout(poll, 5000);
              else this.refreshing = false;
            };
            setTimeout(poll, 3000);
          } catch (e) {
            this.refreshing = false;
          }
        },

        // ── Active bets ──────────────────────────────────────────────────────

        _betKey(source, ev, market, outcome) {
          const base = `${ev.home_team}|${ev.away_team}|${ev.league}|${source}`;
          if (source === 'arb')  return `${base}|${market.market_type}|${market.line}|${outcome.outcome_name}|${outcome.bookmaker}`;
          if (source === 'ev')   return `${base}|${market.market_type}|${market.line}|${market.outcome_name}|${market.bookmaker}`;
          if (source === 'corr') return `${base}|${market.combined_odds}|${market.edge}`;
          return base;
        },

        isBetAdded(source, ev, market, outcome) {
          return this.activeBets.some(b => b.key === this._betKey(source, ev, market, outcome));
        },

        toggleBet(source, ev, market, outcome) {
          const key = this._betKey(source, ev, market, outcome);
          const idx = this.activeBets.findIndex(b => b.key === key);
          if (idx !== -1) {
            this.activeBets.splice(idx, 1);
            this._saveBets();
            return;
          }
          const base = {
            id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
            key,
            addedAt: Date.now(),
            home_team: ev.home_team,
            away_team: ev.away_team,
            league: ev.league,
            sport: ev.sport,
            start_time: ev.start_time,
            source,
          };
          if (source === 'arb') {
            this.activeBets.push({ ...base, market_type: market.market_type, line: market.line,
              outcome_name: outcome.outcome_name, bookmaker: outcome.bookmaker, odds: outcome.odds,
              raw_price: outcome.raw_price ?? null,
              profit_margin: market.profit_margin, edge: null });
          } else if (source === 'ev') {
            this.activeBets.push({ ...base, market_type: market.market_type, line: market.line,
              outcome_name: market.outcome_name, bookmaker: market.bookmaker, odds: market.odds,
              raw_price: null, edge: market.edge, profit_margin: null });
          } else if (source === 'corr') {
            this.activeBets.push({ ...base, combined_odds: market.combined_odds,
              edge: market.edge, legs: market.legs });
          }
          this._saveBets();
          this.showBetsPanel = true;
        },

        removeBet(id) {
          this.activeBets = this.activeBets.filter(b => b.id !== id);
          this._saveBets();
        },

        clearActiveBets() {
          this.activeBets = [];
          this._saveBets();
        },

        _saveBets() {
          try { localStorage.setItem('activeBets', JSON.stringify(this.activeBets)); } catch (_) {}
        },

        loadBets() {
          try {
            const raw = localStorage.getItem('activeBets');
            if (raw) this.activeBets = JSON.parse(raw);
          } catch (_) { this.activeBets = []; }
        },

        // ─────────────────────────────────────────────────────────────────────

        formatLeague(slug) {          const names = { liga_mx: 'Liga MX', premier_league: 'Premier League' };
          return names[slug] ?? slug.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        },

        formatTime(iso) {
          return new Date(iso).toLocaleString(undefined, {
            weekday: 'short', month: 'short', day: 'numeric',
            hour: '2-digit', minute: '2-digit',
          });
        },

        formatMarket(type, line) {
          const label = type.replace(/_/g, ' ');
          return line != null ? label + ' ' + line : label;
        },

        polymarketLabel(outcomeName, line) {
          const abbr = {
            over: 'O', under: 'U',
            home: '1', draw: 'X', away: '2',
            home_or_draw: '1X', home_or_away: '12', draw_or_away: 'X2',
            yes: 'Yes', no: 'No',
          };
          const label = abbr[outcomeName] ?? outcomeName;
          return line != null ? `${label} ${line}` : label;
        },

        americanOdds(decimal) {
          if (decimal >= 2.0) return '+' + Math.round((decimal - 1) * 100);
          return '-' + Math.round(100 / (decimal - 1));
        },
      };
    }
  </script>
</body>

</html>
